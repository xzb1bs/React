<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Runtime and Async Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>JavaScript Runtime and Async Demo</h1>

      <section class="controls">
        <button id="runAllBtn">Run All Tasks</button>
        <button id="runSequentialBtn">Run Sequentially</button>
        <button id="runEventLoopBtn">Run Event Loop Demo</button>
      </section>

      <div class="summary">
        <div class="message-box">
          <h2>Result</h2>
          <p id="resultMessage">Press a button to start.</p>
        </div>
        <div class="message-box">
          <h2>Execution Time</h2>
          <p id="executionTime">0 ms</p>
        </div>
      </div>

      <section class="tasks">
        <h2>Tasks</h2>
        <div id="taskList" class="task-list"></div>
      </section>

      <section class="event-loop-demo">
        <h2>Event Loop Demo</h2>

        <!-- 
7. Async function starts
8. Call stack: end
2. Microtask: promise callback 1
3. Microtask: promise callback 2
4. Async/await resumes
5. Task queue: timer 1
6. Task queue: timer 2
        -->

        <div class="demo-box">
          <h3>Console output</h3>
          <pre id="actualOutput">Run the demo to see the real order.</pre>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
