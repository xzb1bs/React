<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#357c78" />
    <title>Offline · Anime &amp; Manga Library</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #282a31; background: #f6f0e8; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 520px); padding: clamp(24px, 7vw, 48px); border: 1px solid #fff; border-radius: 12px; background: #fffaf2; box-shadow: 0 14px 40px #352a2214; text-align: center; }
      img { width: 76px; height: 76px; }
      h1 { margin: 18px 0 8px; font-family: Georgia, serif; }
      p { color: #77747a; line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 24px; }
      button, a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 11px 18px; border: 1px solid #357c78; border-radius: 4px; background: #357c78; color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      a { background: transparent; color: #357c78; }
      #retry-status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>The connection is unavailable. Your previously saved catalog and visited pages are available when you return to the app.</p>
      <p id="retry-status" role="status">Check your connection and try again.</p>
      <div class="actions">
        <button type="button" id="retry">Retry connection</button>
        <a href="/">Open the library</a>
      </div>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          document.getElementById('retry-status').textContent = 'Still offline. Please try again when the connection returns.';
        }
      });
    </script>
  </body>
</html>
